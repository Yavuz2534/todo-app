<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yapılacaklar Listesi</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Yapılacaklar</h1>

    <form id="todo-form" class="todo-form">
      <input
        type="text"
        id="todo-input"
        placeholder="Yeni görev ekle..."
        autocomplete="off"
      />
      <button type="submit" aria-label="Ekle">+</button>
    </form>

    <div class="filters" id="filters">
      <button class="filter-btn active" data-filter="all">Tümü</button>
      <button class="filter-btn" data-filter="active">Aktif</button>
      <button class="filter-btn" data-filter="done">Tamamlanan</button>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <footer class="footer">
      <span id="count">0 görev</span>
      <button id="clear-done" class="clear-btn">Tamamlananları temizle</button>
    </footer>
  </main>

  <script src="app.js?v=3"></script>
</body>
</html>
